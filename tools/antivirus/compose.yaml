# Run on a trusted host. Publish HTTPS only via a hardened reverse proxy.
services:
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - definitions:/var/lib/clamav
  scanner:
    image: python:3.12-slim
    restart: unless-stopped
    depends_on:
      - clamav
    environment:
      FILE_SCAN_TOKEN: ${FILE_SCAN_TOKEN:?set a private random token}
    command: ["python", "/service/scanner.py"]
    volumes:
      - ./scanner.py:/service/scanner.py:ro
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  definitions:
