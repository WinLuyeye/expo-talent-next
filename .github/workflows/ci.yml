name: Verification du code
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Vérifier le lockfile suivi par Git
        run: |
          git ls-files --error-unmatch -- package-lock.json
          node scripts/verify-lock.mjs
      - name: Installer les dépendances
        run: npm ci
      # prebuild executes typecheck, unit tests and npm audit (high/critical).
      - run: npm run build
