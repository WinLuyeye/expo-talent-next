name: Verification du code
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Vérifier le lockfile suivi par Git
        run: |
          git ls-files --error-unmatch -- package-lock.json
          node scripts/verify-lock.mjs
      - name: Installer les dépendances
        run: npm ci
      # prebuild executes typecheck, unit tests and npm audit (high/critical).
      - run: npm run build
